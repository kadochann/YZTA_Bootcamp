version: '3.8'

services:
  db:
    image: postgres:15
    container_name: {container_name}
    environment:
      POSTGRES_USER: {username}
      POSTGRES_PASSWORD: {password}
      POSTGRES_DB: {db_name}
    ports:
      - "{db_port}:{db_port}"
    volumes:
      - {db_name}:/var/lib/postgresql/data

volumes:
  {db_name}:
